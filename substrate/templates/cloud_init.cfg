#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.sandbox.local
manage_etc_hosts: true

package_update: false
package_upgrade: false

# 1. Deterministic Host SSH Keys
ssh_deletekeys: true
ssh_keys:
  ed25519_private: |
    ${indent(4, host_ed25519_private_key)}
  ed25519_public: ${host_ed25519_public_key}

# 2. Administrator User Setup
users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, kvm, libvirt]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# 3. Kernel Modules and System Tweaks
write_files:
  - path: /etc/ssh/ssh_host_ed25519_key
    permissions: '0600'
    content: |
      ${indent(6, host_ed25519_private_key)}

  - path: /etc/ssh/ssh_host_ed25519_key.pub
    permissions: '0644'
    content: |
      ${host_ed25519_public_key}

  - path: /etc/modules-load.d/kvm.conf
    permissions: '0644'
    content: |
      kvm
      kvm_intel
      vhost_net
      vhost_vsock

  - path: /etc/sysctl.d/99-kubernetes.conf
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 8192

# 4. Boot Commands (Pre-networking)
bootcmd:
  - systemctl enable --now qemu-guest-agent || true

# 5. Run Commands (Post-provisioning)
runcmd:
  - modprobe kvm || true
  - modprobe kvm_intel || modprobe kvm_amd || true
  - modprobe vhost_net || true
  - chmod 666 /dev/kvm || true
  - systemctl enable --now qemu-guest-agent || true
  - systemctl restart ssh || systemctl restart sshd || true
