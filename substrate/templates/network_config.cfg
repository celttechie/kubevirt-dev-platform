version: 2
ethernets:
  default-net:
    match:
      macaddress: "${mac_address}"
    set-name: eth0
    addresses:
      - ${ip_address}/24
    routes:
      - to: default
        via: ${gateway}
    nameservers:
      addresses:
        - ${nameserver}
        - 8.8.8.8
      search:
        - sandbox.local
