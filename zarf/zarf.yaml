kind: ZarfPackageConfig
metadata:
  name: kubevirt-stack
  description: "UDS Virtualization Package: Offline KubeVirt & Containerized Data Importer (CDI) stack"
  version: "1.3.1"
  architecture: "amd64"

components:
  - name: kubevirt-operator
    required: true
    description: "KubeVirt Operator and core virtualization CRDs"
    manifests:
      - name: kubevirt-operator
        namespace: kubevirt
        files:
          - "../manifests/kubevirt-cr.yaml"
    images:
      - "quay.io/kubevirt/virt-operator:v1.3.1"
      - "quay.io/kubevirt/virt-api:v1.3.1"
      - "quay.io/kubevirt/virt-controller:v1.3.1"
      - "quay.io/kubevirt/virt-handler:v1.3.1"
      - "quay.io/kubevirt/virt-launcher:v1.3.1"

  - name: cdi-operator
    required: true
    description: "Containerized Data Importer for disconnected disk management"
    manifests:
      - name: cdi-operator
        namespace: cdi
        files:
          - "../manifests/cdi-cr.yaml"
    images:
      - "quay.io/kubevirt/cdi-operator:v1.60.0"
      - "quay.io/kubevirt/cdi-controller:v1.60.0"
      - "quay.io/kubevirt/cdi-importer:v1.60.0"
      - "quay.io/kubevirt/cdi-uploadproxy:v1.60.0"
      - "quay.io/kubevirt/cdi-uploadserver:v1.60.0"

  - name: sample-workloads
    required: false
    description: "Offline base containerdisks for guest virtual machines"
    images:
      - "quay.io/containerdisks/alpine:latest"
