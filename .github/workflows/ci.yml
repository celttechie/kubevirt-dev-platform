name: CI & Security Validation Workflow

on:
  push:
    branches: [ main, "feat/**", "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-secrets:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  static-analysis:
    name: Lint, Static Checks & IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml ruff

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: Verify OpenTofu Formatting & Validation
        run: |
          cd substrate
          tofu fmt -check
          tofu init -backend=false
          tofu validate

      - name: Lint Shell Scripts with ShellCheck
        run: |
          shellcheck scripts/*.sh tests/*.sh

      - name: Lint & Compile Python Modules
        run: |
          if ls scripts/*.py tests/*.py 1> /dev/null 2>&1; then
            python3 -m py_compile scripts/*.py tests/*.py
            ruff check --select E,F,W --ignore E501 scripts/ tests/
          fi

      - name: Validate YAML Manifests & Templates
        run: |
          python3 -c '
          import pathlib, yaml
          patterns = ["manifests/**/*.yaml", "manifests/**/*.yml", "zarf/**/*.yaml", "tests/**/*.yaml"]
          found = 0
          for p in patterns:
              for f in sorted(pathlib.Path(".").glob(p)):
                  docs = list(yaml.safe_load_all(f.read_text()))
                  assert len(docs) > 0, f"Empty YAML file: {f}"
                  print(f"Validated {f} ({len(docs)} document(s))")
                  found += 1
          print(f"Total YAML files validated: {found}")
          '
